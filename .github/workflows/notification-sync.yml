name: Stage official GST notifications

on:
  workflow_dispatch:
  schedule:
    # Proposed daily time: 07:17 Asia/Kolkata (01:47 UTC). Not a precise timer.
    - cron: '47 1 * * *'

permissions:
  contents: read

concurrency:
  group: gst-notification-sync
  cancel-in-progress: false

jobs:
  stage:
    # Opt-in on BOTH the backend and repository. No ingestion while unset/false.
    # Do not give a manually selected, untrusted branch access to this secret.
    if: >-
      vars.GST_NOTIFICATION_SYNC_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; verified tag, pinned commit
        with:
          persist-credentials: false
      - name: Request import and wait for staging status
        env:
          GST_BACKEND_URL: ${{ vars.GST_BACKEND_URL }}
          GST_NOTIFICATION_SYNC_SECRET: ${{ secrets.GST_NOTIFICATION_SYNC_SECRET }}
          # Stable across reruns: a lost response must not create a second import.
          GST_SYNC_REQUEST_KEY: github:${{ github.repository_id }}:${{ github.run_id }}
        run: python3 scripts/trigger_notification_sync.py
